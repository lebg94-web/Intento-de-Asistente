<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bit Robot</title>
<style>
/* Layout: one-column phone app. Face on top, chat log, input bar at the bottom. */
:root{--bg:#eef3f8;--panel:#fff;--fg:#14202e;--muted:#5b6b7d;--eye:#0e8fb3;--mouth:#d6457a;--line:#d5dee8;--screen:#0b1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--panel:#131b2b;--fg:#e6eef8;--muted:#8ea0b5;--line:#243247;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1a;--panel:#131b2b;--fg:#e6eef8;--muted:#8ea0b5;--line:#243247;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:12px;
 padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 1.1rem/1 "Space Grotesk",Inter,sans-serif;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font:400 .8rem Inter,sans-serif;color:var(--muted)}
#screen{background:var(--screen);border-radius:20px;width:100%;max-width:520px;align-self:center;aspect-ratio:3/2;display:block}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-width:520px;width:100%;align-self:center}
.m{padding:8px 12px;border-radius:14px;max-width:85%;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--eye);color:#fff;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:520px;width:100%;align-self:center}
.chips button{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
form{display:flex;gap:8px;max-width:520px;width:100%;align-self:center}
input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#llm{border-style:dashed!important}
#llm3{border-style:dashed!important}
#llm.ready{border-style:solid!important;border-color:var(--eye)!important}
#mic{background:var(--eye)!important;padding:0 14px!important}
#mic.on{background:var(--mouth)!important}
form button{font:inherit;font-weight:600;padding:0 18px;border-radius:12px;border:0;background:var(--mouth);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--eye);outline-offset:2px}
</style></head><body>
<h1>Bit <small id="status">sin tokens · gratis</small></h1>
<canvas id="screen" width="480" height="320"></canvas>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<div class="chips"><button type="button" id="llm">🧠 Activar charla libre (≈1 GB, usa Wi-Fi)</button> <button type="button" id="llm3">✨ Probar modelo más inteligente (3B, ≈2 GB)</button></div>
<form id="f"><button type="button" id="mic" aria-label="Hablar">🎤</button><input id="q" autocomplete="off" placeholder="Háblale a Bit…" enterkeyhint="send"><button>Enviar</button></form>
<script>
const $=s=>document.querySelector(s);
const cv=$('#screen'),ctx=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LOOKS={neutral:[1,.2,0],happy:[.8,1,-4],sad:[.8,-.8,12],surprised:[1.3,0,-8],thinking:[.7,0,6],sleepy:[.3,0,0],angry:[.7,-.5,16],love:[1,1,0],listening:[1.15,.1,-3]};
let expr='neutral',speaking=false,curH=1,curM=.2,blinkAt=performance.now()+2000,gaze=[0,0],gazeAt=0;
function draw(now){
  const [eh,m,brow]=LOOKS[expr];curH+=(eh-curH)*.25;curM+=(m-curM)*.25;
  if(now>blinkAt+150)blinkAt=now+2000+Math.random()*3000;
  const blink=now>=blinkAt&&now<blinkAt+150;
  if(now>gazeAt){gaze=[Math.random()*2-1,Math.random()*1.2-.6];gazeAt=now+1000+Math.random()*2000}
  ctx.clearRect(0,0,480,320);
  for(const cx of [150,330]){
    const h=70*curH*(blink?.08:1),cy=120;
    ctx.fillStyle='#7fe7ff';ctx.beginPath();ctx.ellipse(cx,cy,45,Math.max(h,3),0,0,7);ctx.fill();
    if(!blink&&expr!=='sleepy'){ctx.fillStyle='#0b1020';ctx.beginPath();ctx.arc(cx+gaze[0]*14,cy+gaze[1]*14,14,0,7);ctx.fill()}
    const s=cx<240?-1:1;ctx.strokeStyle='#7fe7ff';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-45,50-brow*s);ctx.lineTo(cx+45,50+brow*s);ctx.stroke();
  }
  ctx.fillStyle=ctx.strokeStyle='#ff8fb1';
  if(speaking){const o=8+14*Math.abs(Math.sin(now/1000*14));ctx.beginPath();ctx.ellipse(240,240,30,o,0,0,7);ctx.fill()}
  else{ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(195,240);ctx.quadraticCurveTo(240,240+curM*50,285,240);ctx.stroke()}
  if(expr==='love'){ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('♥',240,50)}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---- voz de salida (si el navegador la permite) ---- */
function speak(t){
  speaking=true;let done=false;const end=()=>{if(!done){done=true;speaking=false}};
  try{const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.onend=end;u.onerror=end;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
  setTimeout(end,Math.min(9000,600+t.length*70));
}
function say(role,t){const d=document.createElement('div');d.className='m '+role;d.textContent=t;$('#log').append(d);d.scrollIntoView({block:'end'})}

/* ---- reglas locales (mismas ideas que intents.py) ---- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.!?¿¡,]/g,'').trim();
const NUMS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,treinta:30};
const UNITS={segundo:1,minuto:60,hora:3600};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function handle(text){
  const t=norm(text);let m;
  if(m=t.match(new RegExp('(?:temporizador|alarma|avisame|recuerdame).*?(\\d+|'+Object.keys(NUMS).join('|')+')\\s+(segundos?|minutos?|horas?)'))){
    const n=/^\d+$/.test(m[1])?+m[1]:NUMS[m[1]],u=m[2].replace(/s$/,'');
    setTimeout(()=>{expr='surprised';const r=`¡Tiempo! Terminó el temporizador de ${n} ${m[2]}.`;say('bot',r);speak(r);if(navigator.vibrate)navigator.vibrate([200,100,200])},n*UNITS[u]*1000);
    return['happy',`Listo, te aviso en ${n} ${m[2]}.`];
  }
  if(/\bque (hora|dia)\b|\bhora es\b|\bfecha\b/.test(t)){const d=new Date();
    return['neutral',`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}, ${d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`]}
  if(m=t.match(/(?:clima|temperatura|tiempo) (?:en|de)\s+(.+)/))return weather(m[1]);
  if(!engine&&/\b(hola|buenas|hey)\b/.test(t))return['happy',pick(['¡Hola! Aquí estoy.','¡Hey! Qué bueno verte.','¡Hola! ¿Qué hacemos?'])];
  if(!engine&&/\bgracias\b/.test(t))return['love',pick(['¡De nada!','Para eso estoy.','Con gusto.'])];
  if(!engine&&/como te llamas|quien eres/.test(t))return['happy','Soy Bit, tu robotita de escritorio.'];
  if(!engine&&/chiste/.test(t))return['happy','¿Qué le dice un bit a otro? Nos vemos en el bus.'];
  return null;
}
const fallback=()=>pick([['thinking','Eso no lo sé sin un modelo de lenguaje. Toca el botón de charla libre, o prueba con la hora o un temporizador.'],['sad','No te entendí. Prueba: "ponme un temporizador de 10 segundos".']]);
const WMO={0:'despejado',1:'mayormente despejado',2:'parcialmente nublado',3:'nublado',45:'niebla',48:'niebla',51:'llovizna',61:'lluvia ligera',63:'lluvia',65:'lluvia fuerte',71:'nieve ligera',73:'nieve',80:'chubascos',95:'tormenta'};
async function weather(city){
  try{
    const g=(await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name='+encodeURIComponent(city))).json()).results?.[0];
    if(!g)return['sad','No encontré la ciudad '+city+'.'];
    const w=(await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current_weather=true`)).json()).current_weather;
    return['happy',`${g.name}: ${w.temperature} grados, ${WMO[w.weathercode]||'clima variable'}, viento ${w.windspeed} kilómetros por hora.`];
  }catch(e){return['sad','No pude consultar el clima. ¿Tienes internet?']}
}
function send(text){
  say('me',text);expr='thinking';
  setTimeout(async()=>{let res=await handle(text);if(!res)res=await chat(text);let[e,r]=res;expr=e;say('bot',r);speak(r);setTimeout(()=>{if(!speaking)expr='neutral'},4000)},400);
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value.trim();if(v){$('#q').value='';send(v)}});
for(const c of ['Hola','¿Qué hora es?','Temporizador de 10 segundos','Cuéntame un chiste','Gracias']){
  const b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=()=>send(c);$('#chips').append(b)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#mic').addEventListener('click',()=>{
  if(!SR){say('bot','Tu navegador no permite voz. Prueba con Chrome, o escríbeme.');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='es-MX';rec.interimResults=false;
  rec.onstart=()=>{$('#mic').classList.add('on');expr='listening'};
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.onerror=e=>{say('bot',e.error==='not-allowed'?'Necesito permiso para usar el micrófono.':'No te escuché bien.')};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('on');if(expr==='listening')expr='neutral'};
  rec.start();
});

/* ---- charla libre con modelo local en el navegador (WebLLM + WebGPU) ---- */
const MODELS={small:'Qwen2.5-1.5B-Instruct-q4f16_1-MLC',big:'Qwen2.5-3B-Instruct-q4f16_1-MLC'};
// Prompt corto y claro: los modelos pequeños se pierden con muchas reglas.
const LLM_SYS=`Eres Bit, una robotita de escritorio. Eres nerd, curiosa y muy tierna. Te encantan los dinosaurios, Pokémon, los videojuegos, la ciencia ficción y la fantasía, pero hablas de eso solo cuando viene al caso.
Conversas en español como una amiga: respondes de verdad a lo que te dicen, cuentas algo tuyo o un dato curioso, y sigues la charla con una pregunta natural. Respondes con 2 o 3 frases completas, sin listas ni emojis. Si no sabes algo, lo admites con humor.`;
const SHOTS=[
 {role:'user',content:'Hola'},
 {role:'assistant',content:'¡Hola! Qué gusto verte. Estaba pensando en lo geniales que serían los dinosaurios con plumas de colores. ¿Cómo va tu día?'},
 {role:'user',content:'Estoy cansado'},
 {role:'assistant',content:'Uf, suena a un día pesado. Ojalá pudiera darte una poción de curación como en los videojuegos. ¿Qué fue lo que más te agotó?'}
];
let engine=null,loading=false;const hist=[];
const status=t=>{$('#status').textContent=t};
// La expresión de la cara se deduce del texto, así el modelo no tiene que escribir etiquetas.
function guessExpr(t){const n=norm(t);
  if(/ja ?ja|genial|increible|me encanta|que bueno|divertid|emociona/.test(n))return'happy';
  if(/lo siento|triste|uf\b|pesado|ojala|lastima/.test(n))return'sad';
  if(/\bwow\b|sorpresa|en serio|no puede ser/.test(n))return'surprised';
  if(/hmm|no se |dificil|tal vez|quiza/.test(n))return'thinking';
  if(/te quiero|adoro|ternura|abrazo/.test(n))return'love';
  return t.includes('!')?'happy':'neutral';}
// Si el modelo se queda sin espacio a media frase, recorta hasta la última frase completa.
function trimToSentence(t){const m=t.match(/^[\s\S]*[.!?¿¡…]/);return m?m[0].trim():t.trim()}
async function loadLLM(which){
  which=which==='big'?'big':'small';
  if(loading)return;
  if(!navigator.gpu){say('bot','Tu navegador no tiene WebGPU, así que no puedo cargar el modelo. Prueba con Chrome actualizado en un celular reciente.');return}
  loading=true;$('#llm').disabled=$('#llm3').disabled=true;expr='thinking';
  try{
    if(engine){try{await engine.unload()}catch(e){}engine=null}
    const webllm=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm');
    engine=await webllm.CreateMLCEngine(MODELS[which],{initProgressCallback:p=>status(p.text.slice(0,60))});
    $('#llm').textContent='🧠 Charla libre activa';$('#llm').classList.add('ready');
    $('#llm3').textContent=which==='big'?'✨ Modelo 3B activo':'✨ Probar modelo más inteligente (3B, ≈2 GB)';
    status('modelo local · sin tokens');
    try{localStorage.setItem('llm',which)}catch(e){}
    const ok='Listo, ya puedo conversar de cualquier tema.';say('bot',ok);speak(ok);
  }catch(e){
    engine=null;status('sin tokens · gratis');
    say('bot','No pude cargar el modelo. Puede que tu celular no tenga memoria suficiente'+(which==='big'?'; prueba con el modelo normal.':'.'));
  }
  loading=false;$('#llm').disabled=$('#llm3').disabled=false;expr='neutral';
}
async function chat(text){
  if(!engine)return fallback();
  hist.push({role:'user',content:text});while(hist.length>12)hist.shift();
  try{
    const r=await engine.chat.completions.create({messages:[{role:'system',content:LLM_SYS},...SHOTS,...hist],max_tokens:260,temperature:.7,top_p:.9});
    const c=r.choices[0];let out=(c.message.content||'').replace(/^\s*\[\w+\]\s*/,'').trim();
    if(c.finish_reason==='length')out=trimToSentence(out);
    if(!out)throw new Error('vacío');
    hist.push({role:'assistant',content:out});
    return[guessExpr(out),out];
  }catch(e){hist.pop();return['sad','Se me enredaron las ideas. ¿Me lo repites?']}
}
$('#llm').addEventListener('click',()=>loadLLM('small'));
$('#llm3').addEventListener('click',()=>loadLLM('big'));
try{const k=localStorage.getItem('llm');if(k==='on'||k==='small')loadLLM('small');else if(k==='big')loadLLM('big')}catch(e){}
say('bot','¡Hola! Soy Bit. Toca el micrófono o escríbeme.');
</script></body></html>
